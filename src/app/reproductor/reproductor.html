<div class="player-bar">
  <div class="song-info">
    <div class="album-art-placeholder">
      <svg class="music-note-icon" viewBox="0 0 24 24"></svg>
    </div>
    <div class="song-details">
      <span class="song-title">Paraíso Lunar</span>
      <span class="song-artist">Siddhartha</span>
    </div>
  </div>

  <div class="controls-area">
    <div class="playback-controls">
      <button class="control-btn"><</button>
      <button class="control-btn large-btn">▶</button>
      <button class="control-btn">></button>
    </div>
    <div class="progress-bar-area">
      <span class="time-current">0:30</span>
      <input type="range" min="0" max="200" value="30" class="progress-slider">
      <span class="time-total">3:20</span>
    </div>
  </div>

  <div class="extra-controls">
    </div>
</div>

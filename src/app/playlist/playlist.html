<div class="queue-panel">
  <h2 class="panel-title">Cola de reproducción</h2>
  <ul>
    <li 
      *ngFor="let track of spotifyService.currentQueue()"
      [class.active]="track.id === spotifyService.currentSong()?.id"
      (click)="spotifyService.playTrack(track)">
      {{ track.name }} - {{ track.artists[0].name }}
    </li>
  </ul>
</div>

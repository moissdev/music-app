<div class="results-container">
  <div 
    class="card" 
    *ngFor="let track of spotifyService.searchResults()" 
    (click)="seleccionarCancion(track)">
    
    <img [src]="track.album.images[0]?.url" alt="Album cover">
    <div class="info">
      <h3>{{ track.name }}</h3>
      <p>{{ track.artists[0].name }}</p>
    </div>
  </div>
</div>
